
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Hub | Admin Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1220;color:#eef4ff;font-family:Arial,sans-serif}
.card{width:100%;max-width:420px;padding:30px;background:#121d30;border:1px solid #293950;border-radius:18px}
.logo{width:45px;height:45px;display:grid;place-items:center;background:#58d6b0;color:#06251e;border-radius:12px;font-size:23px;font-weight:bold}
h1{margin:15px 0 5px;font-size:27px}
p{color:#9fb0c9;line-height:1.6}
label{display:block;margin:18px 0 7px;font-size:14px}
input{width:100%;padding:13px;background:#0b1423;border:1px solid #30415b;border-radius:9px;color:white;font-size:15px}
button{width:100%;padding:13px;margin-top:20px;background:#58d6b0;border:0;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer}
#message{color:#ff9292;font-size:14px;min-height:20px;margin-top:12px}
</style>
</head>
<body>
<main class="card">
<div class="logo">S</div>
<h1>Support Hub</h1>
<p>Admin Portal — Sign in to manage complaints and engineers.</p>

<form id="loginForm">
<label for="email">Admin Email</label>
<input id="email" type="email" required autocomplete="username">

<label for="password">Password</label>
<input id="password" type="password" required autocomplete="current-password">

<button id="loginBtn" type="submit">Sign In</button>
<div id="message" role="status"></div>
</form>
</main>

<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");

form.addEventListener("submit", async function(e) {
  e.preventDefault();
  message.textContent = "";
  button.disabled = true;
  button.textContent = "Signing in...";

  try {
    const response = await fetch("/api/auth/admin/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();

    if (!response.ok || !data.token) {
      throw new Error(data.message || "Invalid email or password.");
    }

    sessionStorage.setItem("supportHubAdminToken", data.token);
    window.location.href = "/admin-dashboard.html";

  } catch (error) {
    message.textContent = error.message || "Server connection failed.";
  } finally {
    button.disabled = false;
    button.textContent = "Sign In";
  }
});
</script>
</body>
</html>
